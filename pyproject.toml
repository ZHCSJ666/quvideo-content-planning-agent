[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "market-content-agent"
version = "0.1.0"
description = "Auditable multilingual content planning with bounded replanning and recovery"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain>=1.0,<2", "langchain-openai>=1,<2", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
content-agent = "content_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
